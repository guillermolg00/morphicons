# Keeps action SHA pins and dependencies fresh. Minor/patch bumps arrive
# grouped in a single weekly PR to keep the noise down.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Daily, not weekly: this is what points the website at a fresh morphicons
  # release now that publish.yml no longer bumps the pin itself (see the note
  # at the end of that workflow). Keeps the site at most a day behind npm.
  - package-ecosystem: "bun"
    directory: "/website"
    schedule:
      interval: "daily"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
