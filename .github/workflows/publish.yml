# Publishes to npm whenever the version in package.json changes on main.
#
# How it decides: compares the local version against the npm registry — if
# that exact version is already published, the run is a green no-op. No tag
# or changelog bookkeeping needed to trigger; bumping "version" is the switch.
#
# Auth: npm Trusted Publishing (OIDC) — no long-lived token stored in GitHub.
# One-time setup on npmjs.com (package Settings → Trusted publisher):
#   repository guillermolg00/morphicons, workflow publish.yml.
# Note: npm only allows configuring a trusted publisher for an EXISTING
# package, so the very first publish is done manually (npm login && npm
# publish). Every publish after that is automatic.
name: Publish

on:
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:

permissions:
  contents: write # push the version tag + create the GitHub Release
  id-token: write # npm OIDC (trusted publishing + provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'guillermolg00/morphicons'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Trusted publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Is this version already on npm?
        id: version
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "morphicons@$LOCAL" version 2>/dev/null || true)
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISHED" = "$LOCAL" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "morphicons@$LOCAL is already published — nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "morphicons@$LOCAL is not on the registry — publishing."
          fi

      - name: Install
        if: steps.version.outputs.new == 'true'
        run: bun install --frozen-lockfile

      - name: Typecheck + test
        if: steps.version.outputs.new == 'true'
        run: bun run typecheck && bun test

      - name: Build + size gates
        if: steps.version.outputs.new == 'true'
        run: bun run build && bun run size

      - name: Publish to npm (with provenance)
        if: steps.version.outputs.new == 'true'
        run: npm publish --provenance

      # Release notes come from the version's CHANGELOG.md section (curated in
      # the same commit as the bump); a version without an entry falls back to
      # GitHub's autogenerated notes.
      - name: Tag + GitHub Release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.local }}"
          awk -v ver="$V" '
            index($0, "## [" ver "]") == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md" || true
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            echo "No CHANGELOG.md entry for $V — falling back to autogenerated notes."
            gh release create "v$V" --target "$GITHUB_SHA" --title "v$V" \
              --generate-notes
          fi

      # NOTE — the website's version pin is NOT bumped here.
      #
      # The website consumes the published npm package (exact pin in
      # website/package.json). This job used to bump that pin and push it
      # straight to main, but the "protect-main" ruleset rejects any push
      # without a PR + the "checks" status check, so the v1.2.0 release
      # ended red with GH013 while the package itself was already on npm.
      # Granting the GitHub Actions app a bypass is not an option either:
      # rulesets only accept an Integration that belongs to the owner
      # ORGANIZATION, and this is a personal repo (422 "Actor GitHub
      # Actions integration must be part of the ruleset source or owner
      # organization").
      #
      # So the bump is left to dependabot, which watches /website daily and
      # opens a normal PR — its PRs do trigger CI, unlike anything pushed
      # with GITHUB_TOKEN. The site trails npm by at most a day, and no
      # long-lived secret or weakened branch protection is needed.
