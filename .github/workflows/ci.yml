# Library checks on every push/PR. Runs unconditionally (no paths filter):
# "checks" is a required status check on main, and a filtered-out run would
# leave PRs stuck waiting for it. Actions are pinned by SHA (supply-chain
# hygiene); Dependabot keeps the pins fresh.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (biome)
        run: bun run lint

      - name: Typecheck (strict ×5)
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Size gates
        run: bun run size
